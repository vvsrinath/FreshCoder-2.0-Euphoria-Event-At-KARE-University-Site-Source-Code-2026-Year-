# Netlify deployment for Fresh Coders 2.0 — Euphoria 2026 platform.
[build]
  command = "npm run build && cp dist/index.html dist/404.html"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_PATHS = "src/backend/*,docs/*,netlify.env.example,README.md,src/README.md"

# API routes FIRST — force=true ensures this runs before Netlify's default SPA redirect
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback (Netlify also adds this automatically for Vite, but we define it explicitly)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

