# Netlify deployment for Fresh Coders 2.0 — Euphoria 2026 platform.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@libsql/client", "libsql"]

# SPA fallback — serves index.html for client-side routing
# Does NOT intercept /.netlify/functions/* (Netlify excludes that path)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

